Neos:
  Flow:
    mvc:
      routes:
        'Shel.Neos.TransferContent':
          position: 'before Neos.Neos'

    security:
      authentication:
        providers:
          'Neos.Neos:Backend':
            requestPatterns:
              'Shel.Neos.TransferContent:API':
                pattern: ControllerObjectName
                patternOptions:
                  controllerObjectNamePattern: 'Shel\Neos\TransferContent\Controller\.*'
